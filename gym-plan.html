<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym plan</title>
<meta name="theme-color" content="#17181a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href='data:application/manifest+json,{"name":"Gym plan","short_name":"Gym","display":"standalone","background_color":"%23fbfaf7","theme_color":"%2317181a","start_url":"."}'>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--steel:#17181a;--steel2:#2a2b2e;--tan:#c69b5f;--tan2:#e7cf9e;--oak:#8a6440;--paper:#fbfaf7;--ink:#1e1b17;--mute:#736c62;--line:#e4dfd6;--ok:#3e7a4c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,.big,.tab,.pill,.btn{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--steel);color:#fff;padding:env(safe-area-inset-top) 0 0}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:10px 12px 12px;gap:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:var(--steel2);color:#cfc9bf;padding:8px 12px;border-radius:6px;font-weight:600;font-size:16px;line-height:1.1;text-align:left;cursor:pointer}
.tab small{display:block;font-weight:500;font-size:12px;color:#9a9388}
.tab.on{background:var(--tan);color:var(--steel)}.tab.on small{color:#5a4525}
.tab:focus-visible{outline:2px solid var(--tan2);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 0 110px}
.head{padding:18px 18px 8px}
.head h1{margin:0;font-size:34px;line-height:1;font-weight:700}
.head p{margin:6px 0 0;color:var(--mute)}
.mode{display:flex;align-items:center;gap:10px;margin:14px 18px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mode label{flex:1}
.mode strong{display:block;font-weight:500}.mode span{color:var(--mute);font-size:15px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:#cfc8bb;border:0;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--tan)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.wk{margin:14px 18px 0;font-size:15px;color:var(--mute)}.wk b{color:var(--ink);font-weight:500}
.warm{margin:0 18px 12px;padding:12px 14px;border:1px dashed var(--tan);border-radius:8px;display:flex;gap:12px;align-items:center}.warm p{margin:0;flex:1;font-size:15px}.warm strong{display:block;font-weight:600;font-family:"Barlow Semi Condensed",sans-serif;font-size:17px}
.last{font-size:14px;color:var(--mute);width:100%}.up{display:inline-block;background:var(--tan2);color:#5a4525;border-radius:4px;padding:1px 6px;font-size:13px;font-weight:600;margin-left:6px}
.nudge{margin-top:10px;padding:10px 12px;background:#f1ecdf;border-radius:8px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nudge span{flex:1}.nudge button{border:1px solid var(--oak);background:#fff;color:var(--oak);border-radius:6px;padding:6px 10px;font:inherit;font-weight:600;cursor:pointer}.nudge button.on{background:var(--oak);color:#fff}
.alt{font-size:15px;color:var(--oak);margin:8px 0 0}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.rest{margin:0 18px;padding:12px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--mute);font-size:15px}
.ex{border-top:1px solid var(--line);padding:14px 18px 16px}
.ex:last-of-type{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.ph{width:96px;height:96px;border-radius:8px;object-fit:cover;background:#ddd;display:block}
.num{color:var(--tan);font-weight:700;font-size:14px;letter-spacing:.02em}
.ex h2{margin:0;font-size:22px;line-height:1.1;font-weight:700}
.big{margin-top:6px;font-size:26px;line-height:1;font-weight:600}
.big small{font-size:15px;font-weight:500;color:var(--mute);margin-left:4px}
.works{color:var(--mute);font-size:15px;margin-top:4px}
.more{display:none;margin-top:12px}
.ex.open .more{display:block}
.more img{width:100%;border-radius:10px;display:block;max-height:420px;object-fit:cover}
.eq{font-size:14px;color:var(--mute);margin:6px 0 10px}
.how{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--steel);background:var(--steel);color:#fff;padding:9px 14px;border-radius:6px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
.log{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.sets{display:flex;gap:6px}
.set{width:44px;height:44px;border-radius:8px;border:2px solid var(--tan);background:#fff;color:var(--oak);font-weight:700;font-size:16px;cursor:pointer;font-family:"Barlow Semi Condensed",sans-serif}
.set.done{background:var(--tan);color:var(--steel)}
.set:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.wt{width:92px;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:16px;background:#fff}
.toggle{margin-top:10px;background:none;border:0;color:var(--oak);font:inherit;font-size:15px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--steel);color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;z-index:6}
.timer.on{display:flex}
.timer b{font-family:"Barlow Semi Condensed",sans-serif;font-size:34px;font-weight:600;line-height:1}
.timer span{color:#9a9388;font-size:14px;display:block}
.timer button{background:var(--tan);color:var(--steel);border:0;border-radius:6px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.notes{padding:18px;color:var(--mute);font-size:15px}
.notes h3{color:var(--ink);margin:0 0 6px;font-size:18px}
.notes p{margin:0 0 10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="top"><div class="tabs" id="tabs" role="tablist"></div></div>
<main id="main"></main>
<div class="timer" id="timer"><div><b id="tm">1:30</b><span>rest, then next set</span></div><button id="tstop">Done</button></div>
<script>
const DATA=[{"name": "Upper Push", "focus": "Chest, shoulders, triceps", "dow": "MO", "ex": [{"n": "Matrix chest press", "s": "3", "r": "8-12", "w": "Chest, front shoulders, triceps", "h": "Sit with the handles at mid-chest height. Push forward until arms are almost straight, then come back slowly. Do not lock the elbows hard.", "img": "press", "eq": "Multi-press machine, set to chest press", "yt": "https://www.youtube.com/results?search_query=Matrix+chest+press+form", "alt": "Shoulder or elbow bothering you? Use dumbbells on a flat bench instead, palms slightly turned in."}, {"n": "Incline dumbbell press", "s": "3", "r": "8-12", "w": "Upper chest, front shoulders", "h": "Set the bench to about 30 degrees. Start with dumbbells at shoulder level, press up and slightly together, lower under control.", "img": "bench", "eq": "Adjustable bench next to the Smith machine", "yt": "https://www.youtube.com/results?search_query=Incline+dumbbell+press+form", "alt": ""}, {"n": "Seated dumbbell shoulder press", "s": "3", "r": "8-12", "w": "Shoulders, triceps", "h": "Bench upright. Keep palms facing each other, it is gentler on the elbows. Press overhead, lower to ear level.", "img": "dbrack", "eq": "Dumbbell rack", "yt": "https://www.youtube.com/results?search_query=Seated+dumbbell+shoulder+press+form", "alt": ""}, {"n": "Pec fly machine", "s": "3", "r": "12-15", "w": "Chest", "h": "Handles at chest height. Bring the arms together in a hugging motion with a slight bend in the elbows. Squeeze the chest at the front.", "img": "fly", "eq": "Pec fly / rear delt machine, seat facing out", "yt": "https://www.youtube.com/results?search_query=Pec+fly+machine+form", "alt": ""}, {"n": "Dumbbell lateral raise", "s": "3", "r": "12-15", "w": "Side shoulders (width)", "h": "Light dumbbells at your sides. Raise the arms out to shoulder height, lower slowly. No swinging.", "img": "dbrack", "eq": "Dumbbell rack, start with 10 to 15 lb", "yt": "https://www.youtube.com/results?search_query=Dumbbell+lateral+raise+form", "alt": ""}, {"n": "Rope triceps pushdown", "s": "3", "r": "12-15", "w": "Triceps", "h": "Rope on the high pulley. Pin the elbows to your sides, push down and split the rope at the bottom.", "img": "rope", "eq": "Rope attachment on the cable machine", "yt": "https://www.youtube.com/results?search_query=Rope+triceps+pushdown+form", "alt": "Elbows sore? Do it with a straight bar and lighter weight, or skip it today."}]}, {"name": "Lower A", "focus": "Quads first, then hamstrings", "dow": "TU", "ex": [{"n": "Smith machine squat", "s": "3", "r": "8-12", "w": "Quads, glutes", "h": "Bar on the upper back, feet slightly in front of the bar. Sit down until thighs are parallel, then drive back up.", "img": "smith", "eq": "Smith machine", "yt": "https://www.youtube.com/results?search_query=Smith+machine+squat+form", "alt": ""}, {"n": "Leg extension", "s": "3", "r": "12-15", "w": "Quads", "h": "Shins behind the pad. Extend the legs until straight, pause, lower slowly.", "img": "legs", "eq": "Leg extension / leg curl machine", "yt": "https://www.youtube.com/results?search_query=Leg+extension+form", "alt": ""}, {"n": "Dumbbell Romanian deadlift", "s": "3", "r": "10-12", "w": "Hamstrings, glutes, lower back", "h": "Dumbbells in front of the thighs. Push the hips back with a slight knee bend until you feel the hamstrings stretch, then stand up. Back stays flat the whole time.", "img": "dbrack", "eq": "Dumbbell rack", "yt": "https://www.youtube.com/results?search_query=Dumbbell+Romanian+deadlift+form", "alt": ""}, {"n": "Leg curl", "s": "3", "r": "12-15", "w": "Hamstrings", "h": "Same machine as the extension, pad behind the ankles. Curl the heels toward you, return slowly.", "img": "legs", "eq": "Leg extension / leg curl machine", "yt": "https://www.youtube.com/results?search_query=Leg+curl+form", "alt": ""}, {"n": "Standing calf raise", "s": "3", "r": "12-15", "w": "Calves", "h": "Smith bar on your back, toes on a plate. Rise onto the toes, pause one second at the top, lower all the way down.", "img": "smith", "eq": "Smith machine, put a plate under your toes", "yt": "https://www.youtube.com/results?search_query=Standing+calf+raise+form", "alt": ""}, {"n": "Ab wheel", "s": "3", "r": "8-12", "w": "Abs, core", "h": "From your knees, roll the wheel forward as far as you can while keeping the back flat, then pull back.", "img": "abwheel", "eq": "Ab wheel, hanging on the cable machine", "yt": "https://www.youtube.com/results?search_query=Ab+wheel+form", "alt": ""}]}, {"name": "Upper Pull", "focus": "Back, rear shoulders, biceps", "dow": "WE", "ex": [{"n": "Lat pulldown", "s": "3", "r": "8-12", "w": "Lats (back width), biceps", "h": "Grip slightly wider than the shoulders. Pull the bar to the upper chest leading with the elbows. Return slowly.", "img": "latpull", "eq": "Lat pulldown machine, behind the dumbbell rack", "yt": "https://www.youtube.com/results?search_query=Lat+pulldown+form", "alt": ""}, {"n": "Seated cable row", "s": "3", "r": "8-12", "w": "Mid back, lats, biceps", "h": "Low pulley on the cable machine with a handle. Sit tall, pull the handle to the stomach, squeeze the shoulder blades, return.", "img": "cable", "eq": "Cable machine, low pulley", "yt": "https://www.youtube.com/results?search_query=Seated+cable+row+form", "alt": ""}, {"n": "One-arm dumbbell row", "s": "3", "r": "10-12 each", "w": "Lats, mid back", "h": "Knee and hand on a bench. Pull the dumbbell to your hip with the elbow close to the body, lower slowly.", "img": "dbrack", "eq": "Dumbbell rack and a flat bench", "yt": "https://www.youtube.com/results?search_query=One-arm+dumbbell+row+form", "alt": ""}, {"n": "Rear delt machine", "s": "3", "r": "12-15", "w": "Rear shoulders, upper back", "h": "Same machine as the pec fly, seat facing in. Push the handles out and back like opening a door behind you.", "img": "fly", "eq": "Pec fly / rear delt machine, seat facing in", "yt": "https://www.youtube.com/results?search_query=Rear+delt+machine+form", "alt const dows={MO:1,TU:2,WE:3,FR:5,SA:6};const today=new Date();const todayKey=today.toISOString().slice(0,10);

 main.innerHTML=`<div class="head"><h1>${esc(d.name)}</h1><p>${esc(d.focus)}. 6 exercises, about 50 minutes.</p></div>
 ${isRest?`<div class="rest">Today is a rest day. Showing ${esc(d.name)} in case you want to train anyway. Light cardio is fine too.</div>`:''}
 <div class="wk" id="wk"></div><div class="mode"><label><strong>Week 1 ramp-up</strong><span>${ramp?'2 sets of 12 to 15, keep 5 reps in the tank':'Off. 3 sets, 1 or 2 reps in the tank'}</span></label><button class="sw" id="sw" role="switch" aria-checked="${ramp}" aria-label="Week 1 ramp-up"></button></div>
 <div class="warm"><p><strong>Warm up first</strong>5 minutes easy on the rower or treadmill, then one light set of exercise 1.</p><button class="set${done.warm?' done':''}" data-warm="1" aria-pressed="${!!done.warm}" aria-label="Warm-up done">✓</button></div>
 ${d.ex.map((e,j)=>{const sets=ramp?2:+e.s;const reps=ramp?'12-15':e.r;const k=cur+':'+j;let rec=wts[k]||{};if(typeof rec!=='object')rec={w:rec};const w=rec.w||'';const dn=done[j]||[];const allDone=dn.filter(Boolean).length>=sets;
 return `<section class="ex${openSet.has(k)?' open':''}" id="ex${j}"><div class="row"><img class="ph" src="${IMG[e.img]}" alt=""><div><div class="num">${j+1} of 6</div><h2>${esc(e.n)}</h2><div class="big">${sets} sets of ${reps}</div><div class="works">${esc(e.w)}</div><button class="toggle" data-t="${k}">${openSet.has(k)?'Hide':'How to do it'}</button></div></div>
 <div class="more"><img src="${IMG[e.img]}" alt="${esc(e.eq)}"><div class="eq">${esc(e.eq)}</div><p class="how">${esc(e.h)}</p><a class="btn ghost" href="${e.yt}" target="_blank" rel="noopener">Watch a video</a>${e.alt?`<p class="alt">${esc(e.alt)}</p>`:''}</div>
 <div class="log"><div class="sets">${Array.from({length:sets},(_,s)=>`<button class="set${dn[s]?' done':''}" data-j="${j}" data-s="${s}" aria-pressed="${!!dn[s]}" aria-label="Set ${s+1}">${s+1}</button>`).join('')}</div><input class="wt" type="text" inputmode="decimal" placeholder="lb" value="${esc(String(w))}" data-k="${k}" aria-label="Weight used"><button class="btn" data-rest="${j<2?90:60}">Rest ${j<2?'90':'60'}s</button>${rec.date&&rec.date!==todayKey?`<div class="last">Last time ${esc(rec.date)}: ${esc(String(w))} lb${rec.up?'<span class="up">add weight today</span>':''}</div>`:''}</div>
 ${allDone?`<div class="nudge"><span>Hit ${reps.split(' ')[0].split('-').pop()} reps on every set?</span><button data-up="${k}" class="${rec.up?'on':''}">${rec.up?'Adding weight next time':'Yes, add weight next time'}</button></div>`:''}</section>`}).join('')}
 <div class="notes"><h3>Rules for today</h3><p>Warm up 5 minutes on the rower or treadmill, then one light set of the first exercise.</p><p>Add weight next time once you hit the top of the rep range on every set. Drop weight if you cannot reach the bottom of the range.</p><p>Elbow pain that fades as you warm up is fine. Pain that gets worse during a set means stop that exercise for today.</p></div>`;
 store.s('lastDay',cur);
 const wk=document.getElementById('wk');let msg=`<b>Week ${week}</b> of the plan.`;
 if(week===1)msg+=' Ramp-up week, keep it light.';else if(week===2&&ramp)msg+=' Ramp-up is done, switch it off below.';else if(week%7===0)msg+=' Deload week: 2 sets, moderate weight, then back to normal next week.';
 wk.innerHTML=msg;
}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('button');if(!t)return;
 if(t.dataset.i!=null){cur=+t.dataset.i;render();window.scrollTo(0,0)}
 else if(t.id==='sw'){ramp=!ramp;store.s('ramp',ramp);render()}
 else if(t.dataset.t!=null){openSet.has(t.dataset.t)?openSet.delete(t.dataset.t):openSet.add(t.dataset.t);render()}
 else if(t.dataset.j!=null){const key='done:'+todayKey+':'+cur;const done=store.g(key,{});const a=done[t.dataset.j]||[];a[+t.dataset.s]=!a[+t.dataset.s];done[t.dataset.j]=a;store.s(key,done);render()}
 else if(t.dataset.rest){startTimer(+t.dataset.rest)}
 else if(t.dataset.warm){const key='done:'+todayKey+':'+cur;const done=store.g(key,{});done.warm=!done.warm;store.s(key,done);render()}
 else if(t.dataset.up){const w=store.g('wts',{});let r=w[t.dataset.up]||{};if(typeof r!=='object')r={w:r};r.up=!r.up;w[t.dataset.up]=r;store.s('wts',w);render()}
 else if(t.id==='tstop'){stopTimer()}
});
document.addEventListener('change',ev=>{const i=ev.target;if(i.classList.contains('wt')){const w=store.g('wts',{});let r=w[i.dataset.k]||{};if(typeof r!=='object')r={w:r};if(i.value!==r.w){r.up=false}r.w=i.value;r.date=todayKey;w[i.dataset.k]=r;store.s('wts',w)}});
let tid=null,left=0;const timer=document.getElementById('timer'),tm=document.getElementById('tm');
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let wl=null;async function wake(){try{if('wakeLock'in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}
function startTimer(n){wake();left=n;timer.classList.add('on');tm.textContent=fmt(left);clearInterval(tid);tid=setInterval(()=>{left--;tm.textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(tid);tm.textContent='Go';beep();if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
function stopTimer(){clearInterval(tid);timer.classList.remove('on');if(wl){wl.release();wl=null}}
render();
</script></body></html>
