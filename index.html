<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym plan</title>
<meta name="theme-color" content="#17181a">
<meta name="description" content="Workout tracker for the 5 day plan.">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="public/icon-180.png">
<link rel="icon" href="public/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>

<div class="timer" id="timer" role="status" aria-live="off">
  <div><b id="tm">1:30</b><span id="tlabel">rest, then next set</span></div>
  <button id="tstop" type="button">Done</button>
</div>

<nav class="nav" id="nav">
  <a href="#today" data-route="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9v6M17.5 9v6M3.5 10.5v3M20.5 10.5v3M6.5 12h11"/></svg>
    <span class="navlab">Today</span>
  </a>
  <a href="#history" data-route="history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7"/><path d="M3.5 4v3h3"/></svg>
    <span class="navlab">History</span>
  </a>
  <a href="#summary" data-route="summary">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7.5 15.5l3.5-4 3 2.5 4.5-6"/></svg>
    <span class="navlab">Summary</span>
  </a>
  <a href="#settings" data-route="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    <span class="navlab">Settings</span>
  </a>
</nav>

<script type="module" src="src/app.js"></script>
</body>
</html>
